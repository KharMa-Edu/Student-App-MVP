name: dragomanov_university
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  go_router: ^14.8.1
  slang: ^4.6.0
  slang_flutter: ^4.6.0
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.15
  slang_build_runner: ^4.6.0
  flutter_gen_runner: ^5.10.0

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_gen:
  output: lib/generated/assets

  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

  assets:
    outputs:
      style: dot-delimiter
      package_parameter_enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/drawables/