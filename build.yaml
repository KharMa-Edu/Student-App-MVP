targets:
  $default:
    sources:
      include:
        - pubspec.yaml
        - $package$
        - lib/**
        - assets/**
    builders:
      slang_build_runner:
        options:
          base_locale: uk
          fallback_strategy: base_locale
          input_directory: assets/i18n
          input_file_pattern: .i18n.json
          output_directory: lib/generated/i18n
          output_file_name: translations.g.dart
          lazy: true
          locale_handling: true
          flutter_integration: true
          namespaces: false
          translate_var: t
          enum_name: AppLocale
          class_name: Translations
          translation_class_visibility: private
          key_case: snake
          key_map_case: camel
          param_case: pascal
          sanitization:
            enabled: true
            prefix: k
            case: camel
          string_interpolation: dart
          flat_map: false
          translation_overrides: false
          timestamp: true
          statistics: true
          contexts:
            GenderContext:
              default_parameter: gender
              generate_enum: true
          format:
            enabled: true
            width: 150
          generate_enum: true